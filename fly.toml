# fly.toml app configuration file generated for sip-plan-project-management on 2026-11-26T03:12:09Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sip-plan-project-management'
primary_region = 'sin'
console_command = '/code/manage.py shell'

[build]
[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
